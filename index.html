<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9f4">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff4f7;
      --ink: #4b91a4;
      --muted: #70aebe;
      --rose: #df8fa7;
      --line: #f1dce4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 8% 6%, rgba(246, 190, 207, .42), transparent 25rem),
        radial-gradient(ellipse at 94% 29%, rgba(238, 203, 224, .38), transparent 28rem),
        var(--paper);
      color: var(--ink);
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Noto Sans JP", "Arial Rounded MT Bold", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-weight: 800;
      -webkit-text-stroke: .25px currentColor;
    }

    .page {
      width: min(100% - 48px, 1440px);
      margin-inline: auto;
      padding: 42px 0 76px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: clamp(46px, 8vw, 100px);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .14em;
    }

    .brand-mark { display: inline-flex; align-items: center; gap: 10px; }
    .sparkle { color: var(--rose); font-size: 18px; line-height: 1; }
    .top-note { display: flex; align-items: center; gap: 9px; }
    .top-note::before { content: ""; width: 24px; height: 1px; background: #d8c4b7; }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 38px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6.2vw, 72px);
      font-weight: 800;
      color: #56a4ba;
      letter-spacing: .06em;
      line-height: 1.16;
    }

    .count {
      flex: 0 0 auto;
      padding-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .16em;
    }

    .count strong {
      margin-right: 5px;
      color: var(--rose);
      font-family: inherit;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .rule { height: 1px; background: var(--line); margin-bottom: 30px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(24px, 4vw, 54px) clamp(18px, 2.6vw, 36px);
    }

    .card { min-width: 0; }

    .photo-button {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 0;
      border: 0;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      background: #f4dfe7;
      outline: 1px solid rgba(255,255,255,.92);
      outline-offset: -7px;
      position: relative;
      cursor: zoom-in;
      box-shadow: 0 12px 32px rgba(145, 83, 108, .12);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .photo-button:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 38px rgba(145, 83, 108, .2);
    }

    .photo-button:focus-visible { outline: 3px solid var(--rose); outline-offset: 4px; }

    .photo-button img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .45s ease;
    }

    .photo-button::after {
      content: "";
      position: absolute;
      inset: 8px;
      z-index: 1;
      pointer-events: none;
      border: 1px dashed rgba(255,255,255,.9);
      border-radius: 6px;
    }

    .photo-button:hover img { transform: scale(1.025); }

    .card-info {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 2px 0;
    }

    .name {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #4b91a4;
    }

    .word {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .index {
      color: #5da9bd;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: clamp(54px, 9vw, 110px);
      color: #b29e91;
      font-size: 11px;
      letter-spacing: .16em;
    }

    footer::before, footer::after { content: ""; width: 34px; height: 1px; background: var(--line); }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(39, 31, 27, .88);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, visibility .2s ease;
    }

    .lightbox.is-open { opacity: 1; visibility: visible; }
    .lightbox img { display: block; max-width: min(92vw, 850px); max-height: 86vh; object-fit: contain; border-radius: 5px; box-shadow: 0 18px 70px rgba(0,0,0,.3); }

    .close {
      position: absolute;
      top: 18px;
      right: 22px;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 50%;
      background: transparent;
      color: white;
      font: 300 27px/1 sans-serif;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .page { width: min(100% - 32px, 600px); padding-top: 25px; }
      .topline { margin-bottom: 54px; }
      .intro { margin-bottom: 24px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 16px; }
      .card-info { padding-top: 12px; }
      .name { font-size: 14px; }
    }

    @media (max-width: 420px) {
      .page { width: min(100% - 24px, 380px); padding-top: 20px; }
      .topline { font-size: 10px; margin-bottom: 42px; }
      .top-note { gap: 6px; }
      .top-note::before { width: 14px; }
      .grid { gap: 23px 12px; }
      .photo-button { border-radius: 7px; }
      .card-info { gap: 5px; }
      .word { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline" aria-label="サイト情報">
      <span class="brand-mark"><span class="sparkle" aria-hidden="true">✳</span> MY COLLECTION</span>
      <span class="top-note">小さなアーカイブ</span>
    </div>

    <header class="intro">
      <h1>アーカイブサイト</h1>
      <div class="count"><strong>05</strong> ITEMS</div>
    </header>
    <div class="rule" aria-hidden="true"></div>

    <section class="grid" id="archive" aria-label="写真の一覧"></section>

    <footer>COLLECTED WITH CARE <span class="sparkle" aria-hidden="true">♡</span></footer>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="写真の拡大表示">
    <button class="close" id="close" type="button" aria-label="閉じる">×</button>
    <img id="large-image" alt="">
  </div>

  <script>
    const photos = ["01", "02", "03", "04", "05"];
    const archive = document.querySelector("#archive");
    const lightbox = document.querySelector("#lightbox");
    const largeImage = document.querySelector("#large-image");
    const closeButton = document.querySelector("#close");

    photos.forEach((number) => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <button class="photo-button" type="button" aria-label="${number} の写真を拡大">
          <img src="images/${number}.jpg" alt="${number}" loading="lazy" width="900" height="1200">
        </button>
        <div class="card-info">
          <div>
            <h2 class="name">${number}</h2>
            <p class="word">(ここに言葉)</p>
          </div>
          <span class="index" aria-hidden="true">${number}</span>
        </div>`;
      const image = card.querySelector("img");
      card.querySelector(".photo-button").addEventListener("click", () => {
        largeImage.src = image.src;
        largeImage.alt = image.alt;
        lightbox.classList.add("is-open");
        closeButton.focus();
      });
      archive.append(card);
    });

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      largeImage.removeAttribute("src");
    }

    closeButton.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && lightbox.classList.contains("is-open")) closeLightbox();
    });
  </script>
</body>
</html>
